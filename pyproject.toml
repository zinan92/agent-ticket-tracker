[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-ticket-tracker"
version = "0.1.0"
description = "Local delivery map and safe wake briefs for long-running Agent work"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Park"}]
dependencies = []

[project.scripts]
att = "agent_ticket_tracker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_ticket_tracker = ["web/index.tmpl"]
